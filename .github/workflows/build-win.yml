name: Build Windows Full Portable Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. 检出仓库并自动解压源码包
        uses: actions/checkout@v4

      - name: 2. 解压源码压缩包
        run: |
          powershell Expand-Archive -Path "OfflineCopyExtractor-Win-Source-v2.zip" -DestinationPath "." -Force

      - name: 3. 配置 Python 3.10 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. 安装依赖与内置嗅探浏览器
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: 5. 预下载 SenseVoice 离线语音模型
        run: |
          mkdir models
          curl -L -o models/sensevoice.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar -xjf models/sensevoice.tar.bz2 -C models/
          mv models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/* models/
          rm -rf models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17 models/sensevoice.tar.bz2

      - name: 6. 打包即开即用绿色版目录
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "文案与媒体全能提取工作台" `
            --add-data "models;models" `
            --collect-all rapidocr_onnxruntime `
            --collect-all imageio_ffmpeg `
            --collect-all sherpa_onnx `
            --collect-all playwright `
            app/main.py

      - name: 7. 生成可下载的绿色完整版压缩包
        run: |
          mkdir release_pkg
          xcopy /E /I /Y "dist\文案与媒体全能提取工作台" "release_pkg\文案与媒体全能提取工作台"
          powershell Compress-Archive -Path "release_pkg\文案与媒体全能提取工作台" -DestinationPath "OfflineCopyExtractor-Win-Full-Portable.zip" -Force

      - name: 8. 上传完整安装包
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCopyExtractor-Win-Full-Portable
          path: OfflineCopyExtractor-Win-Full-Portable.zip
          retention-days: 30
